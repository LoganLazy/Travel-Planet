name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: mysql://travel:travel@127.0.0.1:3306/travel
          NEXTAUTH_SECRET: ci-test-secret-0123456789abcdef
          NEXTAUTH_URL: http://localhost:3000
          LLM_PROVIDER: mock
          NOMINATIM_CONTACT: ci@example.com
